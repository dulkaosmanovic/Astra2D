.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .ring { stroke: #fcfcfb; }
.l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; } .l3 { stroke: #1baf7a; }
.f1 { fill: #2a78d6; } .f2 { fill: #eb6834; } .f3 { fill: #1baf7a; }
.l1, .l2, .l3 { fill: none; }
@media (prefers-color-scheme: dark) {
